title: About Me
picture:
  url: /me-2.jpg
  alt: Rejown Ahmed - Full-stack Software Engineer
description: Learn about Rejown Ahmed — Full-stack Software Engineer, Laravel & Vue.js Expert, SaaS Developer, and Founder of Web Makers Ltd. Passionate about technology, education, and mentoring the next generation of developers.
content: |
  Hi, I'm **Rejown Ahmed**, a Full-stack Software Engineer and Founder & CTO of **Web Makers Ltd.** With over six years of experience, I specialize in **SaaS development, Laravel, React.js, Next.js, Vue.js, Nuxt.js, and WordPress**, helping startups and global businesses build scalable, user-focused digital products.

  My journey began with a passion for blending **design and technology** — creating intuitive, high-performing experiences powered by clean, maintainable code. Over the years, I’ve built everything from **Multi Tenant SaaS platforms** and **custom WordPress plugins** to **Chrome, Gmail, and Outlook extensions**, always focused on performance, UX, and scalability.

  ### My Development Philosophy

  I believe great products emerge where **code, design, and strategy** intersect. Whether developing a full SaaS system, API-driven dashboard, or conversion-optimized landing page, my goal is to deliver fast, secure, and elegant solutions that make an impact.

  ### What Drives Me

  I’m passionate about **building technology that solves real problems**. The challenge of translating complex ideas into simple, scalable solutions keeps me motivated every day. Watching a platform I’ve built help businesses grow — that’s what drives me.

  ### Beyond Code

  Beyond coding, I dedicate time to **volunteer work** supporting **homeless and underprivileged children**. I’m also the founder of **Beright Youth Academy**, where I teach **Web Development** and **English Language**, empowering young learners to build confidence and digital skills.
  I regularly provide **consultancy and mentoring** for aspiring developers and entrepreneurs, helping them navigate the world of tech and startup growth.

  Thanks for visiting my portfolio! Feel free to explore my [projects](/projects) or [get in touch](/#contact) if you’re looking for a **SaaS development partner**, **Laravel expert**, or **React/Vue consultant**.
